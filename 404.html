<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable — Plead It</title>
<link rel="icon" href="/icon.png">
<style>
:root { --bg:#1A1A2E; --surface:#16213E; --red:#E94560; --gold:#FFD733; --muted:#AAAAAA; --text:#FFFFFF; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; line-height:1.6; }
main { max-width:720px; margin:0 auto; padding:32px 16px 64px; }
header { display:flex; align-items:center; gap:12px; margin-bottom:32px; }
header img { width:44px; height:44px; border-radius:10px; }
header a { color:var(--text); text-decoration:none; font-weight:800; letter-spacing:1px; font-size:20px; }
h1 { font-size:32px; margin:0 0 8px; }
h2 { font-size:18px; color:var(--gold); margin:28px 0 8px; }
p, li { color:#E6E6EE; }
.muted { color:var(--muted); font-size:14px; }
.tagline { color:var(--red); font-weight:700; font-size:20px; margin:0 0 24px; }
.card { background:var(--surface); border-radius:18px; padding:20px; margin:16px 0; }
.btn { display:inline-block; background:var(--gold); color:var(--bg); font-weight:800;
  padding:14px 22px; border-radius:14px; text-decoration:none; }
a { color:var(--gold); }
nav { display:flex; flex-wrap:wrap; gap:16px; margin-top:48px; font-size:14px; }
.hero { text-align:center; padding-top:24px; }
.hero img { width:120px; height:120px; border-radius:28px; }
</style>
</head>
<body>
<main>
<header><img src="/icon.png" alt=""><a href="/">PLEAD IT</a></header>
<h1>Page introuvable</h1><p><a href="/">Retour à l'accueil</a></p>
<nav>
  <a href="/">Accueil</a>
  <a href="/privacy/">Confidentialité</a>
  <a href="/terms/">Conditions d'utilisation</a>
  <a href="/support/">Support</a>
</nav>
<p class="muted">© 2026 Plead It</p>
</main>
</body>
</html>
